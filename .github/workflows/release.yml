name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-runtime: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Check the tag matches the project version
        id: version
        shell: bash
        run: |
          version="$(dotnet msbuild src/dotnet-http-file -getProperty:Version)"
          echo "Tag: '$GITHUB_REF_NAME', project version: '$version'"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/dotnet-http-file -c Release -o artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "artifacts/dotnet-http-file.${{ steps.version.outputs.version }}.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
